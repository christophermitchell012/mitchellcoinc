<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Resilience Act reporting clock</title>
  <desc id="desc">A timeline showing awareness at zero hours, early warning at 24 hours, fuller notification at 72 hours, and later final reporting.</desc>
  <rect width="1200" height="630" fill="#101820"/>
  <text x="90" y="110" fill="#f4f4f4" font-family="Arial, sans-serif" font-size="46" font-weight="700">The reporting clock starts before the form does.</text>
  <text x="90" y="165" fill="#b9c2ca" font-family="Arial, sans-serif" font-size="25">EU Cyber Resilience Act • product workflow view</text>
  <line x1="130" y1="345" x2="1070" y2="345" stroke="#72d6a0" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="170" cy="345" r="25" fill="#72d6a0"/><text x="170" y="285" fill="#f4f4f4" font-size="28" font-weight="700">0h</text><text x="170" y="410" fill="#f4f4f4" font-size="24">Awareness</text>
    <circle cx="450" cy="345" r="25" fill="#72d6a0"/><text x="450" y="285" fill="#f4f4f4" font-size="28" font-weight="700">24h</text><text x="450" y="410" fill="#f4f4f4" font-size="24">Early warning</text>
    <circle cx="730" cy="345" r="25" fill="#72d6a0"/><text x="730" y="285" fill="#f4f4f4" font-size="28" font-weight="700">72h</text><text x="730" y="410" fill="#f4f4f4" font-size="24">Full notification</text>
    <circle cx="1010" cy="345" r="25" fill="#72d6a0"/><text x="1010" y="285" fill="#f4f4f4" font-size="28" font-weight="700">Later</text><text x="1010" y="410" fill="#f4f4f4" font-size="24">Final report</text>
  </g>
  <text x="90" y="535" fill="#b9c2ca" font-family="Arial, sans-serif" font-size="24">Product → version → evidence → impact → mitigation → traceable source</text>
  <text x="1110" y="585" fill="#7f8b94" font-family="Arial, sans-serif" font-size="18" text-anchor="end">MitchellCo</text>
</svg>