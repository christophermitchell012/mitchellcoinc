<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">API-first platform surfaces</title>
  <desc id="desc">Diagram showing one platform API serving a web UI, infrastructure automation, internal portal, and embedded product.</desc>
  <rect width="1200" height="630" fill="#0b1220"/>
  <text x="70" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="700">API-first means the UI is one client</text>
  <text x="70" y="136" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">The platform boundary moves when every important control is programmable.</text>
  <rect x="390" y="245" width="420" height="120" rx="18" fill="#162033" stroke="#38bdf8" stroke-width="3"/>
  <text x="600" y="295" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">Platform API</text>
  <text x="600" y="333" text-anchor="middle" fill="#bae6fd" font-family="Arial, sans-serif" font-size="20">objects • actions • permissions • state</text>
  <g fill="#111827" stroke="#64748b" stroke-width="2">
    <rect x="70" y="445" width="230" height="92" rx="14"/><rect x="340" y="445" width="230" height="92" rx="14"/>
    <rect x="610" y="445" width="230" height="92" rx="14"/><rect x="880" y="445" width="250" height="92" rx="14"/>
  </g>
  <g fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="185" y="500">Web UI</text><text x="455" y="500">CI/CD + IaC</text><text x="725" y="500">Internal portal</text><text x="1005" y="500">Embedded product</text>
  </g>
  <g stroke="#38bdf8" stroke-width="3" fill="none">
    <path d="M500 365 L185 445"/><path d="M555 365 L455 445"/><path d="M645 365 L725 445"/><path d="M700 365 L1005 445"/>
  </g>
  <text x="70" y="592" fill="#64748b" font-family="Arial, sans-serif" font-size="18">MitchellCo • original illustration</text>
</svg>