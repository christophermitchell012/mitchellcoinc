<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Endpoint change blast radius</title>
<desc id="desc">A diagram showing a configuration change moving through simulation, a pilot ring, and fleet rollout, with the number of exposed devices increasing at each stage.</desc>
<rect width="1200" height="630" fill="#0b1220"/>
<text x="70" y="90" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="700">Make the blast radius visible before rollout</text>
<text x="70" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">Prediction reduces uncertainty. Staged exposure limits consequences.</text>
<line x1="180" y1="330" x2="1010" y2="330" stroke="#64748b" stroke-width="4"/>
<polygon points="1010,330 985,315 985,345" fill="#64748b"/>
<circle cx="210" cy="330" r="78" fill="#132238" stroke="#38bdf8" stroke-width="5"/>
<circle cx="560" cy="330" r="118" fill="#132238" stroke="#4ade80" stroke-width="5"/>
<circle cx="920" cy="330" r="165" fill="#132238" stroke="#f59e0b" stroke-width="5"/>
<text x="210" y="320" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">SIMULATE</text>
<text x="210" y="353" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">0 devices</text>
<text x="560" y="320" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">PILOT</text>
<text x="560" y="353" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">small ring</text>
<text x="920" y="320" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">FLEET</text>
<text x="920" y="353" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">full scope</text>
<text x="70" y="565" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">A safe control tells you what will change, how sure it is, where to start, and how to get back.</text>
<text x="1080" y="595" text-anchor="end" fill="#64748b" font-family="Arial, sans-serif" font-size="18">MitchellCo</text>
</svg>