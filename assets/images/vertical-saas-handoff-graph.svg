<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Vertical SaaS handoff graph</title><desc id="desc">A workflow graph showing healthy systems connected by costly handoffs, with the product opportunity concentrated on the edges.</desc>
<rect width="1200" height="630" fill="#0b1220"/><text x="70" y="90" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="700">The product opportunity may be between the boxes</text>
<text x="70" y="135" fill="#94a3b8" font-family="Arial,sans-serif" font-size="22">Map the workflow as nodes and handoffs before adding another feature.</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="245" width="210" height="105" rx="16" fill="#162033" stroke="#64748b" stroke-width="2"/><text x="185" y="290" fill="#f8fafc" font-size="25">Custodian</text><text x="185" y="322" fill="#94a3b8" font-size="17">balances • positions</text>
<rect x="370" y="245" width="210" height="105" rx="16" fill="#162033" stroke="#64748b" stroke-width="2"/><text x="475" y="290" fill="#f8fafc" font-size="25">Portfolio</text><text x="475" y="322" fill="#94a3b8" font-size="17">performance • holdings</text>
<rect x="660" y="245" width="210" height="105" rx="16" fill="#162033" stroke="#64748b" stroke-width="2"/><text x="765" y="290" fill="#f8fafc" font-size="25">CRM</text><text x="765" y="322" fill="#94a3b8" font-size="17">history • follow-up</text>
<rect x="950" y="245" width="170" height="105" rx="16" fill="#162033" stroke="#64748b" stroke-width="2"/><text x="1035" y="290" fill="#f8fafc" font-size="25">Planning</text><text x="1035" y="322" fill="#94a3b8" font-size="17">goals • assumptions</text></g>
<g stroke="#22c55e" stroke-width="5" fill="none"><path d="M290 297 H370"/><path d="M580 297 H660"/><path d="M870 297 H950"/></g>
<g fill="#22c55e" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="330" y="278">re-key</text><text x="620" y="278">reconcile</text><text x="910" y="278">approve</text></g>
<rect x="260" y="430" width="680" height="105" rx="18" fill="#10251b" stroke="#22c55e" stroke-width="2"/><text x="600" y="475" fill="#dcfce7" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="700">Vertical product surface</text><text x="600" y="510" fill="#86efac" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Remove cross-system work • preserve provenance • stop at accountable judgment</text>
</svg>