<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page Not Found | MitchellCo Inc.</title>
  <meta name="description" content="The requested page could not be found on MitchellCo Inc." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07111f" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <style>
    :root{
      --bg:#06101e;
      --panel:#0f1e33;
      --ink:#f3fbff;
      --muted:#abc4da;
      --line:rgba(160,215,255,.20);
      --cyan:#00d4ff;
      --green:#00f5a0;
      --violet:#8b5cf6;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:2rem;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 80% 10%,rgba(0,212,255,.18),transparent 24%),
        radial-gradient(circle at 15% 12%,rgba(0,245,160,.12),transparent 22%),
        radial-gradient(circle at 20% 80%,rgba(139,92,246,.13),transparent 26%),
        linear-gradient(90deg,rgba(0,212,255,.07) 1px,transparent 1px) 0 0/44px 44px,
        linear-gradient(0deg,rgba(0,245,160,.045) 1px,transparent 1px) 0 0/44px 44px,
        var(--bg);
    }
    main{
      width:min(760px,100%);
      padding:clamp(2rem,6vw,4.5rem);
      text-align:center;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(15,30,51,.9),rgba(9,20,36,.9));
      box-shadow:0 30px 90px rgba(0,0,0,.34);
      backdrop-filter:blur(16px);
    }
    .brand{
      display:inline-flex;
      align-items:center;
      gap:.7rem;
      margin-bottom:2.25rem;
      font-weight:900;
      letter-spacing:-.04em;
      text-decoration:none;
      color:var(--ink);
    }
    .brand-mark{
      width:40px;
      height:40px;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(135deg,rgba(0,245,160,.22),rgba(0,212,255,.12));
      position:relative;
      overflow:hidden;
      box-shadow:0 0 26px rgba(0,212,255,.14);
    }
    .brand-mark:before{
      content:"";
      position:absolute;
      inset:9px;
      background:linear-gradient(135deg,var(--green),var(--cyan));
      clip-path:polygon(50% 0,100% 100%,0 100%);
    }
    .code{
      margin:0 0 .4rem;
      font-size:clamp(5rem,18vw,10rem);
      line-height:.8;
      letter-spacing:-.08em;
      font-weight:950;
      background:linear-gradient(90deg,var(--green),var(--cyan),var(--violet));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      -webkit-text-fill-color:transparent;
    }
    h1{
      margin:.9rem 0 1rem;
      font-size:clamp(2rem,5vw,3.4rem);
      line-height:1;
      letter-spacing:-.055em;
    }
    p{
      margin:0 auto 1.8rem;
      max-width:570px;
      color:var(--muted);
      font-size:1.08rem;
      line-height:1.6;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:.86rem 1.2rem;
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      color:var(--bg);
      background:var(--ink);
      box-shadow:0 18px 38px rgba(0,0,0,.24),0 0 24px rgba(0,245,160,.18);
      font-weight:900;
      text-decoration:none;
      transition:transform .18s ease;
    }
    .btn:hover{transform:translateY(-3px)}
    .small{
      margin-top:1.4rem;
      font-size:.86rem;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="MitchellCo Inc. home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>MitchellCo Inc.</span>
    </a>

    <div class="code">404</div>
    <h1>Page not found.</h1>
    <p>The page you’re looking for doesn’t exist, may have moved, or the address may have been entered incorrectly.</p>
    <a class="btn" href="/">Return to MitchellCo Inc.</a>
    <div class="small">Product • AI • Analytics • Execution</div>
  </main>
</body>
</html>
